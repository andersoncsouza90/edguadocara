name: Radar de concursos

# A coleta (PCI + notícias) é feita pelo agente de curadoria
# (.claude/skills/radar-curadoria). Este workflow valida o registro e
# republica o site: a cada mudança em data/ e uma vez por dia, para que
# "inscrições abertas → encerradas" mude sozinho conforme a data.
on:
  push:
    paths: ["data/**", "radar/**", "tests/**"]
  schedule:
    - cron: "17 9 * * *"   # 06:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest discover -s tests
      - name: Validar registro
        run: python -m radar validar
      - name: Gerar site
        run: python -m radar site
      - name: Publicar
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "radar: site de $(date -u +%F)"
          git push
