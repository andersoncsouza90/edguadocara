name: Vigia das fontes oficiais

# Lê sites de bancas e o DOU várias vezes ao dia (sem IA) e põe as novidades
# das áreas fiscal, controle e policial na fila da curadoria (data/vigia/).
on:
  schedule:
    - cron: "23 9-23/3 * * *"   # 06:23, 09:23, 12:23, 15:23, 18:23 em Brasília
    - cron: "23 1 * * *"        # 22:23 em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler fontes
        run: python -m radar vigiar
      - name: Publicar
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          # só o vigia escreve em data/vigia/{detectados,saude,dou_lidos}.json: o rebase não conflita
          git add data/vigia
          git diff --cached --quiet || git commit -m "vigia: $(date -u '+%F %H:%M') UTC"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          python -m radar site
          git add docs
          git diff --cached --quiet || git commit -m "radar: site de $(date -u '+%F %H:%M') UTC"
          git push
